<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TVN Intelligence</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TVN Intel">
<meta property="og:title" content="TVN Intelligence">
<meta property="og:description" content="Thông tin, hàm ý, nhận thức thị trường, dòng tiền. TVN & Partners.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --ink:#1A1A1A; --muted:#566173; --line:#D6DDE7;
  --navy:#1F3864; --navy-ink:#1F3864; --gold:#C8992F; --gold-ink:#8A6A1E;
  --band:#DCE6F1; --note:#EDF1F7; --good:#1E7A46; --bad:#A93434;
  --chip:#E7EDF6; --shadow:0 1px 0 rgba(31,56,100,.06);
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1522; --surface:#152035; --ink:#E6EBF2; --muted:#9AA7BB; --line:#2A3B57;
    --navy:#2F5597; --navy-ink:#A9C1EE; --gold:#D9AE4A; --gold-ink:#E2BE6A;
    --band:#1C2B45; --note:#192841; --good:#5CC08A; --bad:#E88080; --chip:#22324F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1522; --surface:#152035; --ink:#E6EBF2; --muted:#9AA7BB; --line:#2A3B57;
  --navy:#2F5597; --navy-ink:#A9C1EE; --gold:#D9AE4A; --gold-ink:#E2BE6A;
  --band:#1C2B45; --note:#192841; --good:#5CC08A; --bad:#E88080; --chip:#22324F;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--navy-ink)}
button{font:inherit;color:inherit}
img,svg{max-width:100%}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:2px solid var(--gold)}
.top .wrap{display:flex;align-items:center;gap:12px;height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.brand svg{height:30px;width:auto;flex:none}
.brand{flex:1 1 auto}.brand>div{min-width:0}
.themebtn{flex:none}
.brand b{display:block;font-size:15px;color:var(--navy-ink);letter-spacing:.2px;white-space:nowrap}
.brand span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top nav{margin-left:auto;display:flex;gap:4px}
.top nav a{padding:8px 12px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px}
.top nav a[aria-current="page"]{color:var(--navy-ink);background:var(--note)}
.themebtn{margin-left:6px;border:1px solid var(--line);background:transparent;border-radius:6px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center}
.themebtn svg{width:18px;height:18px}

/* bottom nav (mobile) */
.bottom{display:none}
@media (max-width:720px){
  .top nav{display:none}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bottom a{flex:1;text-align:center;padding:9px 4px 8px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:500}
  .bottom a svg{display:block;margin:0 auto 2px;width:22px;height:22px}
  .bottom a[aria-current="page"]{color:var(--navy-ink)}
  .bottom a[aria-current="page"] svg{stroke:var(--gold)}
  main{padding-bottom:84px}
}
main{padding-top:18px;padding-bottom:40px}

/* list */
h1{font-size:26px;line-height:1.25;color:var(--navy-ink);margin:6px 0 10px;font-weight:700}
.lead{color:var(--muted);margin:0 0 16px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.filters button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13.5px;white-space:nowrap;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;margin-bottom:12px}
.item{display:grid;grid-template-columns:76px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.item:first-child{border-top:1px solid var(--line)}
.tag{font-weight:700;color:var(--navy-ink);font-size:18px;line-height:1.15;word-break:break-word}
.tag small{display:block;font-weight:500;font-size:11.5px;color:var(--gold-ink);margin-top:4px}
.item h3{margin:0 0 4px;font-size:15.5px;line-height:1.35}
.item p{margin:0;color:var(--muted);font-size:13.5px}
.item .meta{font-size:12px;color:var(--muted);margin-top:6px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:left}
.empty h2{margin:0 0 6px;font-size:17px;color:var(--navy-ink)}
.empty p{margin:0 0 8px;color:var(--muted)}

/* report */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--navy-ink);font-weight:500;padding:4px 0;cursor:pointer;text-decoration:none}
.kicker{color:var(--gold-ink);font-weight:600;font-size:13px;margin-top:10px}
.datepill{display:inline-block;background:var(--navy);color:#fff;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:4px}
.conclusion{background:var(--band);border-left:5px solid var(--gold);padding:14px 16px;margin:16px 0;font-weight:600;color:var(--navy-ink);font-size:16px;line-height:1.5}
.request{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 14px}
.request b{color:var(--ink);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--navy);padding:10px 12px}
.stat b{display:block;font-size:24px;color:var(--navy-ink);line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.sec{margin:26px 0 0}
.sec>h2{background:var(--band);color:var(--navy-ink);font-size:16.5px;margin:0 0 12px;padding:9px 14px}
.sec p{margin:0 0 10px}
.bullets{margin:0 0 10px;padding-left:20px}
.bullets li{margin:0 0 6px}
.note{background:var(--note);border-left:3px solid var(--navy);padding:12px 14px;margin:12px 0}
.note .lbl{font-weight:700;color:var(--navy-ink);font-size:13.5px;margin-bottom:4px}
.note .s{margin:0 0 3px}
.note .s:first-of-type{font-weight:700}
.tbl{overflow-x:auto;margin:6px 0 12px;border:1px solid var(--line)}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
.tbl th{background:var(--navy);color:#fff;text-align:left;padding:7px 9px;font-weight:600}
.tbl td{padding:7px 9px;border-top:1px solid var(--line);vertical-align:top;background:var(--surface)}
.rows{display:none;gap:8px;margin:6px 0 12px}
.rowcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--navy);padding:10px 12px}
.rowcard .rt{font-weight:700;color:var(--navy-ink);margin-bottom:4px;font-size:15px}
.rowcard dl{margin:0;display:grid;grid-template-columns:minmax(92px,38%) 1fr;gap:3px 10px;font-size:13.5px}
.rowcard dt{color:var(--muted)} .rowcard dd{margin:0}
@media (max-width:620px){.tblwrap .tbl{display:none}.tblwrap .rows{display:grid}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:8px 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gold);padding:10px 12px}
.card b{display:block;color:var(--navy-ink);margin-bottom:3px}
.card span{font-size:13.5px;color:var(--muted)}
.src{font-size:12px;color:var(--muted);margin:4px 0 10px}

/* seven questions */
.q7{display:grid;gap:10px;margin:6px 0}
.q{background:var(--surface);border:1px solid var(--line);padding:12px 14px;position:relative}
.q .head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.q .num{font-weight:700;color:var(--gold-ink);font-variant-numeric:tabular-nums}
.q h3{margin:0;font-size:15px;color:var(--navy-ink);flex:1;min-width:180px}
.q .ans{margin:0}
.q .foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.q[data-v="tot"]{border-left:4px solid var(--good)}
.q[data-v="xau"]{border-left:4px solid var(--bad)}
.q[data-v="trung_tinh"],.q[data-v="chua_ro"]{border-left:4px solid var(--line)}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--navy);color:var(--navy-ink);background:transparent}
.chip.du_kien{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.gia_thuyet{border-color:var(--gold);color:var(--gold-ink)}
.chip.tin{border-color:var(--line);color:var(--muted);font-weight:500}
.verdict{font-size:12px;font-weight:600}
.verdict.tot{color:var(--good)} .verdict.xau{color:var(--bad)} .verdict.trung_tinh,.verdict.chua_ro{color:var(--muted)}
.qsrc{font-size:12px;color:var(--muted);margin-top:6px}

/* implications */
.imp{background:var(--surface);border:1px solid var(--line);margin:0 0 10px}
.imp .t{padding:12px 14px 6px;font-weight:600;color:var(--navy-ink)}
.imp .chips{padding:0 14px 8px;display:flex;gap:6px;flex-wrap:wrap}
.imp details{border-top:1px solid var(--line)}
.imp summary{padding:9px 14px;cursor:pointer;font-size:13.5px;color:var(--navy-ink);font-weight:500}
.imp .body{padding:0 14px 12px;font-size:14px}
.imp .body h4{margin:10px 0 4px;font-size:13px;color:var(--muted);font-weight:600}
.imp .body ul{margin:0;padding-left:18px}
.imp .ok{color:var(--good)} .imp .no{color:var(--bad)}
.imp .kv{padding:0 14px 10px;display:grid;gap:6px;font-size:14px}
.imp .kvr{display:grid;grid-template-columns:96px 1fr;gap:8px;border-top:1px solid var(--line);padding-top:6px}
.imp .kvr b{font-size:13px}
@media (min-width:700px){.imp .kv{grid-template-columns:1fr 1fr}.imp .kvr{grid-template-columns:1fr}}

/* scenarios & watch */
.scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.scen div{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--navy);padding:10px 12px;font-size:14px}
.scen b{display:block;color:var(--navy-ink);margin-bottom:4px}
.remember{background:var(--note);border-left:6px solid var(--navy);padding:14px 16px;margin:26px 0 8px}
.remember h2{margin:0 0 6px;font-size:16.5px;color:var(--navy-ink)}
.remember p{margin:0 0 4px}
.remember p:first-of-type{font-weight:700}
.limits{font-size:13px;color:var(--muted)}

/* gauge */
.gauge{display:grid;grid-template-columns:minmax(180px,240px) 1fr;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:12px 14px;margin:12px 0}
@media (max-width:520px){.gauge{grid-template-columns:1fr}}
.gauge .big{font-size:34px;font-weight:700;color:var(--navy-ink);line-height:1.1;font-variant-numeric:tabular-nums}
.gauge .lbl{font-weight:700;color:var(--navy-ink);font-size:17px}
.gauge p{margin:4px 0 0;color:var(--muted);font-size:14px}

/* ask */
.ask{background:var(--surface);border:1px solid var(--line);padding:14px;margin:26px 0 0}
.ask h2{margin:0 0 4px;font-size:16px;color:var(--navy-ink)}
.ask p.h{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.ask textarea{width:100%;min-height:70px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{border:0;background:var(--navy);color:#fff;padding:9px 16px;border-radius:6px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--navy-ink);border:1px solid var(--line)}
.btn:disabled{opacity:.55;cursor:default}
.answer{white-space:pre-wrap;margin-top:12px;font-size:14.5px}
.status{font-size:13px;color:var(--muted);margin-top:8px}

/* compare */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:620px){.cmp{grid-template-columns:1fr}}
.cmp .col{background:var(--surface);border:1px solid var(--line);padding:12px}
.cmp .col h3{margin:0 0 2px;font-size:14px;color:var(--navy-ink)}
.cmp .col .d{font-size:12px;color:var(--muted);margin-bottom:8px}
.cmp .qq{border-top:1px solid var(--line);padding:8px 0;font-size:13.5px}
.cmp .qq b{display:block;font-size:12.5px;color:var(--gold-ink)}
select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:100%}
.pick{display:grid;gap:8px;grid-template-columns:1fr 1fr 1fr;margin-bottom:14px}
@media (max-width:620px){.pick{grid-template-columns:1fr}}

/* help */
.cmd{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);padding:10px 12px;margin:0 0 8px}
.cmd code{flex:1;font-family:inherit;font-weight:600;color:var(--navy-ink)}
.steps{padding-left:20px} .steps li{margin-bottom:8px}

/* footer */
footer{margin-top:36px;border-top:2px solid var(--gold);padding-top:16px;font-size:13px;color:var(--muted)}
.contact{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.contact dd{overflow-wrap:anywhere}
@media (max-width:400px){.qr{width:84px}.qr svg{width:72px;height:72px}.contact dl{grid-template-columns:auto minmax(0,1fr)}}
.contact dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.contact dt{font-weight:600;color:var(--ink)} .contact dd{margin:0}
.contact h4{margin:0;color:var(--navy-ink);font-size:14px}
.qr{width:96px;background:#fff;padding:5px;border:1px solid var(--line);text-align:center}
.qr svg{width:84px;height:84px;display:block}
.qr span{display:block;font-size:10.5px;color:#1F3864;font-weight:600;margin-top:2px}
.slogan{background:var(--navy);color:var(--gold);text-align:center;font-weight:600;padding:9px;margin:14px 0 8px;font-size:13.5px}
.disc{font-size:11.5px}
.run{display:grid;gap:12px;margin-bottom:8px}
.runcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--navy);padding:14px}
.runcard h2{margin:0 0 4px;font-size:17px;color:var(--navy-ink)}
.runcard p{margin:0 0 10px;color:var(--muted);font-size:14px}
.runcard input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px}
.ph .row input{flex:1 1 120px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.runcard input[type=date]{min-height:44px}
.runcard .btn{width:100%;padding:12px}
.runcard .ferr{color:var(--bad);font-size:13px;min-height:18px;margin:0 0 6px}
.runmsg{font-size:14px;color:var(--navy-ink);background:var(--note);border-left:3px solid var(--navy);padding:10px 12px;margin:4px 0 0}
.ph{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.ph:first-child{border-top:1px solid var(--line)}
.ph .n{font-weight:600}
.ph .m{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.st{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.st.cho{color:var(--gold-ink);border-color:var(--gold)} .st.dang_chay{color:var(--navy-ink);border-color:var(--navy)}
.st.xong{color:var(--good);border-color:var(--good)} .st.loi{color:var(--bad);border-color:var(--bad)}
.linkbtn{border:0;background:none;color:var(--navy-ink);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
.newrun{display:inline-block;margin:0 0 14px;text-decoration:none}
.exp{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 0}
.exp .btn{flex:1 1 140px;padding:11px 12px}
.exp .st2{flex-basis:100%;font-size:13px;color:var(--muted);min-height:18px}
.print{position:absolute;left:-10000px;top:0;width:738px;background:#fff;color:#1A1A1A;color-scheme:light;
  --bg:#FFFFFF;--surface:#FFFFFF;--ink:#1A1A1A;--muted:#566173;--line:#D6DDE7;--navy:#1F3864;--navy-ink:#1F3864;--gold:#C8992F;--gold-ink:#8A6A1E;
  --band:#DCE6F1;--note:#EDF1F7;--good:#1E7A46;--bad:#A93434;--chip:#E7EDF6;font-size:14px}
.print>*{margin-top:0}
.print .tblwrap .tbl{display:block!important;overflow:visible}.print .tblwrap .rows{display:none!important}
.print .tbl table{min-width:0;font-size:12.5px}.print details,.print .exp,.print .back,.print .ask{display:none!important}
.print .gauge{grid-template-columns:220px 1fr}.print .stats{grid-template-columns:repeat(4,1fr)}
.print .phead{display:flex;align-items:center;gap:12px;border-bottom:2px solid #C8992F;padding:0 0 10px;margin-bottom:6px}
.print .phead svg{height:40px;width:auto}.print .phead b{display:block;color:#1F3864;font-size:16px}.print .phead span{font-size:11.5px;color:#566173}
.print .phead .r{margin-left:auto;text-align:right;color:#8A6A1E;font-weight:700;font-size:12px}
.op{position:absolute;left:-10000px;top:0;color-scheme:light;--surface:#fff;--line:#D6DDE7;width:1200px;height:1697px;background:#fff;color:#1A1A1A;font-family:"Be Vietnam Pro",system-ui,Arial,sans-serif;padding:44px 52px 0;box-sizing:border-box;overflow:hidden}
.op .opbody{height:1452px;overflow:hidden}
.op .optop{display:flex;align-items:center;gap:16px;border-bottom:3px solid #C8992F;padding-bottom:14px}
.op .optop svg{height:58px;width:auto}.op .optop b{display:block;font-size:24px;color:#1F3864}.op .optop span{font-size:15px;color:#566173}
.op .optop .r{margin-left:auto;text-align:right}.op .optop .r .k{color:#8A6A1E;font-weight:700;font-size:18px}.op .optop .r .d{display:inline-block;background:#1F3864;color:#fff;font-weight:600;font-size:15px;padding:4px 12px;margin-top:6px}
.op h1{font-size:31px;line-height:1.25;color:#1F3864;margin:16px 0 12px;max-height:118px;overflow:hidden}
.op .opkl{background:#DCE6F1;border-left:7px solid #C8992F;padding:14px 18px;font-size:18.5px;line-height:1.45;font-weight:600;color:#1F3864;max-height:150px;overflow:hidden}
.op .opss{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.op .opss div{border:1px solid #D6DDE7;border-top:5px solid #1F3864;padding:9px 12px;height:96px;overflow:hidden}
.op .opss b{display:block;font-size:28px;color:#1F3864;line-height:1.15}.op .opss span{font-size:13.5px;color:#566173;line-height:1.3}
.op .opcols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.op h2{font-size:18px;background:#DCE6F1;color:#1F3864;margin:0 0 8px;padding:6px 10px}

var LIBS = null;
function loadScript(src){ return new Promise(function(res, rej){ var t = document.createElement('script'); t.src = src; t.onload = res; t.onerror = function(){ rej(new Error('lib')); }; document.head.appendChild(t); }); }
function libs(){
  if (!LIBS) LIBS = Promise.all([
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')]);

function cut(x, n){ x = S(x).replace(/\s+/g, ' ').trim(); return x.length > n ? x.slice(0, n - 1).replace(/[\s,;:.]+\S*$/, '') + '…' : x; }
function slug(x){ return S(x).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'bao-cao'; }
function fileBase(d){ var dt = S(d.ngay).slice(0, 10).replace(/-/g, ''); return 'TVN-Intelligence-' + slug(d.chu_the) + '-' + dt; }
function saveFile(f){
  var type = /\.pdf$/.test(f.filename) ? 'application/pdf' : 'image/png';
  var file = null; try { file = new File([f.data], f.filename, {type: type}); } catch(e) {}
  var mobile = /iPhone|iPad|iPod|Android|Mobi/i.test(navigator.userAgent);
  if (file && mobile && navigator.canShare && navigator.canShare({files:[file]})) {
    return navigator.share({files:[file], title: f.filename}).catch(function(e){ if (e && e.name === 'AbortError') return; return dl(); });
  }
  return dl();
  function dl(){
    var url = URL.createObjectURL(f.data), a = document.createElement('a');
    a.href = url; a.download = f.filename; a.rel = 'noopener'; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 8000);
  }
}

function tpFlow(d){
